name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app
        run: cd web && npm ci && npm run build
      - name: Install pinned Xray for integration tests
        run: |
          curl -fsSL --retry 3 https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip -o /tmp/xray.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip' | sha256sum -c -
          mkdir -p /tmp/xray && unzip -q /tmp/xray.zip -d /tmp/xray
      - name: Test and vet Go services
        env:
          XRAY_BIN: /tmp/xray/xray
        run: go test ./... && go vet ./...
      - name: Build deployment images
        run: docker build -f Dockerfile.panel -t vpc-panel:test . && docker build -f Dockerfile.agent -t vpc-agent:test .
