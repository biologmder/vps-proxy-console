name: Publish Agent image
on:
  push:
    branches: [main]
    paths:
      - 'cmd/agent/**'
      - 'internal/model/**'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/publish-agent.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/biologmder/vps-proxy-console-agent:main
            ghcr.io/biologmder/vps-proxy-console-agent:sha-${{ github.sha }}
